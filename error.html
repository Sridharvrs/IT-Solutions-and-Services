
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Stackly</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/error.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <main class="error-page">

    <div class="error-grid"></div>
    <div class="error-glow glow-one"></div>
    <div class="error-glow glow-two"></div>

    <div class="error-content">

      <a href="index.html" class="error-logo">
        <img src="images/logo.webp" alt="Stackly Logo">
      </a>

      <div class="error-illustration">
        <span class="error-orbit orbit-one"></span>
        <span class="error-orbit orbit-two"></span>

        <div class="error-number">
          <span>4</span>
          <div class="error-zero">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <span>4</span>
        </div>

        <div class="error-floating float-one">
          <i class="fa-solid fa-code"></i>
        </div>

        <div class="error-floating float-two">
          <i class="fa-solid fa-cloud"></i>
        </div>

        <div class="error-floating float-three">
          <i class="fa-solid fa-bolt"></i>
        </div>
      </div>

      <div class="error-text">
        <span class="error-label">
          <i class="fa-solid fa-circle-exclamation"></i>
          ERROR 404
        </span>

        <h1>Oops! Page <span>Not Found</span></h1>

        <p>
          The page you're looking for may have been moved,
          deleted, or never existed. Let's get you back on track.
        </p>
      </div>

      <div class="error-actions">
        <a href="index.html" class="error-home">
          <i class="fa-solid fa-house"></i>
          Back to Home
        </a>

        <button class="error-back" onclick="history.back()">
          <i class="fa-solid fa-arrow-left"></i>
          Go Back
        </button>
      </div>

      <div class="error-bottom">
        <span>Need assistance?</span>
        <a href="contact.html">Contact our team <i class="fa-solid fa-arrow-up-right-from-square"></i></a>
      </div>

    </div>

    <div class="error-copy">
      © 2026 Stackly IT Solutions. All rights reserved.
    </div>

  </main>

</body>
</html>
